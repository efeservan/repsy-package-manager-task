services:
  app:
    build: .
    container_name: repsy-app
    ports:
      - "8098:8098"
    environment:
      - STORAGE_STRATEGY=object-storage
      # PostgreSQL bağlantısı için 'localhost' yerine 'postgres' servis adını kullandık
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/repsy
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      # MinIO bağlantısı için de servis adını kullandık (localhost yerine)
      - OBJECT_STORAGE_ENDPOINT=http://minio:9000
      - OBJECT_STORAGE_ACCESS_KEY=minioadmin
      - OBJECT_STORAGE_SECRET_KEY=minioadmin
      - OBJECT_STORAGE_BUCKET_NAME=repsy-packages
      - FILESYSTEM_STORAGE_LOCATION=/data/packages
    volumes:
      - package-data:/data/packages
    depends_on:
      postgres:
        condition: service_healthy # postgres healthcheck'i geçene kadar bekliyoruz
      minio:
        condition: service_started # minio için basit healthcheck yoksa sadece başlamasını bekliyoruz
    networks:
      - repsy-network

  postgres:
    image: postgres:14-alpine
    container_name: repsy-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=repsy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - repsy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repsy"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: repsy-minio
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000" # API Portu
      - "9001:9001" # Konsol Portu
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - repsy-network

volumes:
  package-data:
  postgres-data:
  minio-data:

networks:
  repsy-network:
    driver: bridge