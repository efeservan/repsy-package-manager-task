# Application port
server.port=8098

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/repsy
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Storage strategy (file-system or object-storage)
storageStrategy=${STORAGE_STRATEGY:file-system}

# File system storage configuration
storage.filesystem.location=${FILESYSTEM_STORAGE_LOCATION:/data/packages}

# Object storage configuration (Minio)
storage.objectstorage.endpoint=${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
storage.objectstorage.accessKey=${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
storage.objectstorage.secretKey=${OBJECT_STORAGE_SECRET_KEY:minioadmin}
storage.objectstorage.bucket=${OBJECT_STORAGE_BUCKET_NAME:repsy-packages}

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB